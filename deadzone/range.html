  <body>
    <!-- The loading screen, shared by the game and the practice range (inserted by the loading-screen plugin in
     vite.config.ts). It paints before the page's scripts arrive, so its styles live here and not in a stylesheet. -->
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-display: swap; src: url("./fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url("./fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url("./fonts/barlow-latin-500-normal.woff2") format("woff2"); }
  #loading-screen { position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #0e1316; color: #eef2f4;
    font-family: "Barlow", system-ui, sans-serif; transition: opacity .45s ease, visibility 0s; }
  #loading-screen.done { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, visibility 0s linear .45s; }
  #loading-screen.enter { opacity: 0; }
  #loading-screen.done *, #loading-screen.done *::after { animation: none !important; }
  #loading-screen .ls-art { position: absolute; inset: -3%; background: #141b1f center / cover no-repeat;
    opacity: 0; transition: opacity .8s ease; animation: ls-drift 24s ease-out both; }
  #loading-screen .ls-art.ready { opacity: 1; }
  #loading-screen .ls-shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(14,19,22,.94) 0%, rgba(14,19,22,.72) 38%, rgba(14,19,22,.15) 72%, rgba(14,19,22,.35) 100%),
                linear-gradient(0deg, rgba(14,19,22,.92) 0%, rgba(14,19,22,0) 42%); }
  #loading-screen .ls-logo { position: absolute; top: 34px; left: clamp(20px, 5vw, 64px); font: 800 30px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; }
  #loading-screen .ls-logo i { color: #f2b53c; font-style: normal; margin: 0 2px; display: inline-block; transform: skewX(-8deg); }
  #loading-screen .ls-body { position: absolute; left: clamp(20px, 5vw, 64px); right: clamp(20px, 5vw, 64px); bottom: clamp(36px, 9vh, 88px); max-width: 640px; }
  #loading-screen .ls-kicker { display: block; font: 600 14px/1 "Barlow Condensed", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #f2b53c; }
  #loading-screen .ls-map { margin: 10px 0 6px; font: 800 clamp(48px, 9vw, 104px)/.9 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .01em; }
  #loading-screen .ls-mode { margin: 0 0 26px; font-size: 17px; color: #b9c4ca; min-height: 1.3em; }
  #loading-screen .ls-bar { position: relative; height: 4px; background: rgba(238,242,244,.14); overflow: hidden; }
  #loading-screen .ls-bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #f2b53c, #ffd27a); transition: width .35s ease; }
  #loading-screen .ls-bar::after { content: ""; position: absolute; inset: 0; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent); animation: ls-sheen 1.6s linear infinite; }
  #loading-screen .ls-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px;
    font: 600 14px/1.2 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8d9aa1; }
  #loading-screen .ls-tip { position: absolute; right: clamp(20px, 5vw, 64px); bottom: clamp(36px, 9vh, 88px); max-width: 340px; margin: 0;
    padding: 14px 16px; border-left: 3px solid #f2b53c; background: rgba(14,19,22,.72); color: #c9d3d8; font-size: 15px; line-height: 1.45; }
  #loading-screen .ls-tip b { display: block; margin-bottom: 4px; font: 600 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .2em; color: #f2b53c; }
  /* Loaded and waiting for the click that captures the mouse. */
  #loading-screen.ready { cursor: pointer; }
  #loading-screen.ready .ls-bar::after { animation: none; opacity: 0; }
  #loading-screen.ready .ls-step { color: #f2b53c; animation: ls-pulse 1.4s ease-in-out infinite; }
  @keyframes ls-pulse { 50% { opacity: .45; } }
  @media (max-width: 900px) { #loading-screen .ls-tip { display: none; } }
  @keyframes ls-drift { from { transform: scale(1.06) translateX(1%); } to { transform: scale(1) translateX(0); } }
  @keyframes ls-sheen { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
  @media (prefers-reduced-motion: reduce) { #loading-screen .ls-art, #loading-screen .ls-bar::after, #loading-screen.ready .ls-step { animation: none; } }
  /* A plain start opens on the home screen, not a map: just the logo and the bar, no map name or picture. */
  #loading-screen.boot .ls-art, #loading-screen.boot .ls-shade, #loading-screen.boot .ls-kicker, #loading-screen.boot .ls-map,
  #loading-screen.boot .ls-mode, #loading-screen.boot .ls-tip { display: none; }
  #loading-screen.boot .ls-logo { top: 50%; left: 50%; transform: translate(-50%, -100%); font-size: clamp(44px, 7vw, 72px); }
  #loading-screen.boot .ls-body { top: 50%; bottom: auto; left: 50%; right: auto; width: min(420px, calc(100% - 40px)); transform: translate(-50%, 28px); }
</style>
<div id="loading-screen" role="status" aria-live="polite">
  <div class="ls-art"></div><div class="ls-shade"></div>
  <div class="ls-logo">DEAD<i>/</i>ZONE</div>
  <div class="ls-body">
    <small class="ls-kicker">Loading</small>
    <h1 class="ls-map">Deadzone</h1>
    <p class="ls-mode"></p>
    <div class="ls-bar"><i></i></div>
    <div class="ls-row"><span class="ls-step">Starting</span><span class="ls-pct">0%</span></div>
  </div>
  <p class="ls-tip"><b>TIP</b><span></span></p>
</div>

    <script src="./touch-notice.js"></script>
    <script>
      (function () {
        var TIPS = [
          "Sprint, then crouch to slide into cover.",
          "Every key can be rebound in Settings, Controls.",
          "The recoil wall shows your spray pattern: pull against it.",
          "Three of the dummies shoot back in the Combat drill.",
        ];
        var root = document.getElementById("loading-screen");
        root.querySelector(".ls-map").textContent = "The Yard";
        root.querySelector(".ls-kicker").textContent = "Deadzone · Training facility";
        root.querySelector(".ls-mode").textContent = "Shooting lanes · Recoil bay · Dummy bay";
        root.querySelector(".ls-tip span").textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
        var art = root.querySelector(".ls-art"), img = new Image();
        img.onload = function () { art.style.backgroundImage = "url(" + img.src + ")"; art.classList.add("ready"); };
        img.src = "./loading/range.jpg";
      })();
    </script>
    <div id="app"></div>
  </body>
</html>
